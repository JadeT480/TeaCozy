<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Tea Cozy</title>
  <link rel="stylesheet" href="styles.css" type="text/css">
</head>
<body>
  <header>
    <!-- Logo -->
    <img src="https://content.codecademy.com/courses/freelance-1/unit-4/img-tea-cozy-logo.png" alt="Tea Cozy logo">
    <!-- Navigation -->
    <nav>
      <ul>
        <li><a href="#mission">Mission</a></li>
        <li><a href="#featured-tea">Featured Tea</a></li>
        <li><a href="#locations">Locations</a></li>
      </ul>
    </nav>
  </header>
  <main>
    <!-- Mission section -->
    <div id="mission">
      <div class="banner">
        <h2>Our Mission</h2>
        <h4>Handpicked, Artisanally Curated, Free Range, Sustainable, Small Batch, Fair Trade, Organic Tea</h4>
      </div>
    </div>
    <!-- Tea of the month -->
    <div id="featured-tea">
      <div>
        <h2>Tea of the Month</h2>
        <h4>What's Steeping at The Tea Cozy?</h4>
      </div>
      <div class="monthly-tea">
        <img src="http://content.codecademy.com/courses/freelance-1/unit-4/img-berryblitz.jpg" alt="Berries floating in tea">
        <p>Fall Berry Blitz Tea</p>
      </div>
      <div class="monthly-tea">
        <img src="https://content.codecademy.com/courses/freelance-1/unit-4/img-spiced-rum.jpg" alt="Box of loose tea">
        <p>Spiced Rum Tea</p>
      </div>
      <div class="monthly-tea">
        <img src="https://content.codecademy.com/courses/freelance-1/unit-4/img-donut.jpg" alt="Tasty donut">
        <p>Seasonal Donuts</p>
      </div>
      <div class="monthly-tea">
        <img src="https://content.codecademy.com/courses/freelance-1/unit-4/img-myrtle-ave.jpg" alt="Cup of Myrtle Ave Tea">
        <p>Myrtle Ave Tea</p>
      </div>
      <div class="monthly-tea">
        <img src="https://content.codecademy.com/courses/freelance-1/unit-4/img-bedford-bizarre.jpg" alt="Cup of Bedford Bizarre Tea">
        <p>Bedford Bizarre Tea</p>
      </div>
    </div>
    <!-- Locations -->
    <div id="locations"></div>
  </main>
  <footer></footer>
</body>
</html>
